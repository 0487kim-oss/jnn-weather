name: 카카오 알림 최초 연결 (1회)
on:
  workflow_dispatch:
    inputs:
      code:
        description: "카카오 동의 후 이동한 주소 전체(또는 code= 뒤의 값)"
        required: true
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests pynacl
      - name: 토큰 발급 및 저장
        env:
          KAKAO_CODE: ${{ github.event.inputs.code }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "::add-mask::$KAKAO_CODE"
          python tools/kakao_setup.py
